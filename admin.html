  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

\n\n<div style=\"min-height:100vh;display:flex;flex-direction:column\">\n<header style=\"background:#1D2647;color:#FBFAF7;padding:.9rem clamp(20px,4vw,48px);display:flex;align-items:center;justify-content:space-between;gap:1rem\" data-screen-label=\"Admin · Header\">\n  <div style=\"display:flex;align-items:center;gap:.8rem\">\n    <img src=\"cf2e7f51-abc1-41c9-9445-673b09558f0e\" alt=\"\" style=\"height:38px;width:auto;filter:brightness(0) invert(1)\">\n    <div>\n      <div style=\"font-family:'Bodoni Moda',serif;font-size:1.05rem\">Site Admin<\u002Fdiv>\n      <div style=\"font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;opacity:.75\">Barbara’s Academy of Dance<\u002Fdiv>\n      <sc-if value=\"{{ authed }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size:.7rem;opacity:.6;margin-top:.15rem\">Connected to {{ signedInAs }}<\u002Fdiv><\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-if value=\"{{ authed }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ signOut }}\" style=\"background:none;border:1px solid rgba(251,250,247,.4);color:#FBFAF7;border-radius:999px;padding:.4rem 1.1rem;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer\">Sign out<\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fheader>\n\n<main style=\"flex:1;width:100%;max-width:860px;margin:0 auto;padding:clamp(24px,4vw,48px) 20px 80px\">\n\n<sc-if value=\"{{ showLogin }}\" hint-placeholder-val=\"{{ true }}\">\n  <section data-screen-label=\"Admin · Sign in\" style=\"max-width:460px;margin:6vh auto 0;background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:2rem;box-shadow:0 14px 40px rgba(29,38,71,.08);animation:fadein .35s ease both\">\n    <h1 style=\"font-family:'Bodoni Moda',serif;font-weight:400;font-size:1.6rem;margin-bottom:.3rem\">Sign in<\u002Fh1>\n    <p style=\"color:#56618A;font-size:.9rem;margin-bottom:1.4rem;line-height:1.5\">Updates you save here publish to barbarasdancestudio.com automatically in about a minute.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:1rem\">\n      <label style=\"display:block;font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A\">Site code\n        <input type=\"text\" value=\"{{ cfgRepo }}\" sc-camel-on-change=\"{{ setRepo }}\" placeholder=\"e.g. yourname/BHDance\" style=\"margin-top:.35rem;font-weight:400;letter-spacing:0;text-transform:none\">\n      <\u002Flabel>\n      <label style=\"display:block;font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A\">Access key\n        <input type=\"password\" value=\"{{ cfgToken }}\" sc-camel-on-change=\"{{ setToken }}\" placeholder=\"github_pat_…\" style=\"margin-top:.35rem;font-weight:400;letter-spacing:0;text-transform:none\">\n      <\u002Flabel>\n      <sc-if value=\"{{ loginError }}\" hint-placeholder-val=\"{{ false }}\">\n        <p style=\"color:#7C3A4D;font-size:.85rem;background:rgba(124,58,77,.07);border-radius:8px;padding:.6rem .8rem\">{{ loginError }}<\u002Fp>\n      <\u002Fsc-if>\n      <button sc-camel-on-click=\"{{ signIn }}\" style=\"background:#1D2647;color:#FBFAF7;border:none;border-radius:999px;padding:.75rem;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;cursor:pointer\" style-hover=\"background:#2A3253\">{{ signInLabel }}<\u002Fbutton>\n      <p style=\"font-size:.82rem;color:#56618A;text-align:center\">Remembered on this computer — you only do this once.<\u002Fp>\n    <\u002Fdiv>\n    <details style=\"margin-top:1.3rem;font-size:.85rem;color:#2A3253;line-height:1.55\">\n      <summary style=\"cursor:pointer;font-weight:600;color:#56618A\">First time? How to get your access key<\u002Fsummary>\n      <ol style=\"margin:.6rem 0 0 1.1rem;display:flex;flex-direction:column;gap:.4rem\">\n        <li>Sign in at <a href=\"https://github.com\" target=\"_blank\" rel=\"noopener\">github.com<\u002Fa> with the account that holds the site.<\u002Fli>\n        <li>Go to <a href=\"https://github.com/settings/personal-access-tokens/new\" target=\"_blank\" rel=\"noopener\">Settings → Developer settings → Fine-grained tokens → Generate new token<\u002Fa>.<\u002Fli>\n        <li>Name it “Studio site admin”, set expiration to 1 year, and under <strong>Repository access<\u002Fstrong> choose <strong>Only select repositories<\u002Fstrong> → the site’s repository.<\u002Fli>\n        <li>Under <strong>Permissions → Repository permissions<\u002Fstrong>, set <strong>Contents<\u002Fstrong> to <strong>Read and write<\u002Fstrong>.<\u002Fli>\n        <li>Generate, copy the key that starts with <code>github_pat_<\u002Fcode>, and paste it above.<\u002Fli>\n      <\u002Fol>\n    <\u002Fdetails>\n  <\u002Fsection>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ authed }}\" hint-placeholder-val=\"{{ false }}\">\n  <div style=\"animation:fadein .35s ease both\">\n  <nav aria-label=\"Sections\" style=\"position:sticky;top:0;z-index:50;display:flex;flex-wrap:wrap;gap:.4rem;background:#F3F1EB;padding:.6rem 0;margin-bottom:1rem\">\n    <sc-for list=\"{{ jumps }}\" as=\"j\" hint-placeholder-count=\"0\">\n      <button sc-camel-on-click=\"{{ j.go }}\" style=\"border:1px solid rgba(29,38,71,.25);background:#FBFAF7;color:#1D2647;border-radius:999px;padding:.35rem .9rem;font-size:.75rem;letter-spacing:.06em;cursor:pointer;display:flex;align-items:center;gap:.4rem\">{{ j.label }}<span style=\"width:7px;height:7px;border-radius:50%;background:#C9A227;display:{{ j.dot }}\"><\u002Fspan><\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fnav>\n  <section id=\"sec-glance\" data-screen-label=\"Admin · At a glance\" style=\"margin-bottom:1.4rem\">\n    <h2 style=\"font-family:'Bodoni Moda',serif;font-weight:400;font-size:1.3rem;margin-bottom:.8rem\">Site at a glance<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem\">\n      <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"6\">\n        <div style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:12px;padding:1rem 1.1rem\">\n          <div style=\"font-family:'Bodoni Moda',serif;font-size:1.9rem;line-height:1;color:#1D2647\">{{ k.v }}<\u002Fdiv>\n          <div style=\"font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A;margin-top:.45rem\">{{ k.label }}<\u002Fdiv>\n          <div style=\"font-size:.78rem;color:#56618A;margin-top:.15rem\">{{ k.sub }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section id=\"sec-traffic\" data-screen-label=\"Admin · Traffic\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <div style=\"display:flex;align-items:baseline;gap:.6rem;flex-wrap:wrap\">\n      <h2 style=\"font-family:'Bodoni Moda',serif;font-weight:400;font-size:1.3rem\">Visitors<\u002Fh2>\n      <a href=\"https://bhdance.goatcounter.com\" target=\"_blank\" rel=\"noopener\" style=\"margin-left:auto;font-size:.72rem;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:#56618A;text-decoration:none;white-space:nowrap\">Full traffic dashboard ↗<\u002Fa>\n    <\u002Fdiv>\n    <sc-if value=\"{{ trafficReady }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.7rem;margin-top:1rem\">\n        <sc-for list=\"{{ traffic }}\" as=\"t\" hint-placeholder-count=\"0\">\n          <div style=\"background:#fff;border:1px solid rgba(29,38,71,.12);border-radius:12px;padding:1rem 1.1rem\">\n            <div style=\"font-family:'Bodoni Moda',serif;font-size:1.9rem;line-height:1;color:#1D2647\">{{ t.v }}<\u002Fdiv>\n            <div style=\"font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A;margin-top:.45rem\">{{ t.label }}<\u002Fdiv>\n            <div style=\"font-size:.78rem;color:#56618A;margin-top:.15rem\">visits, all time<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ trafficSetup }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"margin-top:1rem;font-size:.88rem;color:#2A3253;line-height:1.6;background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.35);border-radius:10px;padding:.9rem 1.1rem\">\n        <strong>One-time setup:<\u002Fstrong> visitor counting is wired into the site but needs a free GoatCounter account.\n        <ol style=\"margin:.5rem 0 0 1.1rem;display:flex;flex-direction:column;gap:.3rem\">\n          <li>Sign up at <a href=\"https://www.goatcounter.com\" target=\"_blank\" rel=\"noopener\">goatcounter.com<\u002Fa> and choose the code <strong>bhdance<\u002Fstrong> (so your dashboard is bhdance.goatcounter.com).<\u002Fli>\n          <li>In GoatCounter’s Settings, tick <em>“Allow adding visitor counts on your website”<\u002Fem>.<\u002Fli>\n          <li>Publish the site once — counts appear here within a day of traffic.<\u002Fli>\n        <\u002Fol>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · Announcement\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <details>\n    <summary id=\"sec-announce\" style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;display:flex;align-items:center;gap:.6rem\"><span style=\"font-size:.75em\">▸<\u002Fspan>Announcement bar<span title=\"Unpublished changes\" style=\"width:9px;height:9px;border-radius:50%;background:#C9A227;display:{{ chAnnounce }}\"><\u002Fspan><a href=\"index.html\" target=\"_blank\" sc-camel-on-click=\"{{ stopClick }}\" style=\"margin-left:auto;font-family:'Jost',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#56618A;text-decoration:none;white-space:nowrap\">View live page ↗<\u002Fa><\u002Fsummary>\n    <label style=\"display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:#56618A;cursor:pointer;margin:.7rem 0 1rem\">\n      <input type=\"checkbox\" checked=\"{{ annShow }}\" sc-camel-on-change=\"{{ toggleAnnShow }}\" style=\"width:auto;accent-color:#1D2647\">Show on the home page\n    <\u002Flabel>\n    <div style=\"background:#1D2647;color:#FBFAF7;text-align:center;padding:.55rem 24px;font-size:.78rem;letter-spacing:.1em;border-radius:8px;margin-bottom:1.1rem;opacity:{{ annPreviewOpacity }}\">\n      {{ annText }} <span style=\"text-decoration:underline;margin-left:.5rem;white-space:nowrap\">{{ annLinkText }}<\u002Fspan>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:1fr;gap:.9rem\">\n      <label style=\"font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A\">Message\n        <input type=\"text\" value=\"{{ annText }}\" sc-camel-on-change=\"{{ setAnnText }}\" style=\"margin-top:.35rem;font-weight:400;letter-spacing:0;text-transform:none\">\n      <\u002Flabel>\n      <div style=\"display:grid;grid-template-columns:1fr 1.4fr;gap:.9rem\">\n        <label style=\"font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A\">Button text\n          <input type=\"text\" value=\"{{ annLinkText }}\" sc-camel-on-change=\"{{ setAnnLinkText }}\" style=\"margin-top:.35rem;font-weight:400;letter-spacing:0;text-transform:none\">\n        <\u002Flabel>\n        <label style=\"font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A\">Button link (web address)\n          <input type=\"text\" value=\"{{ annLinkHref }}\" sc-camel-on-change=\"{{ setAnnLinkHref }}\" style=\"margin-top:.35rem;font-weight:400;letter-spacing:0;text-transform:none\">\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdetails>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · Calendar\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <details>\n    <summary id=\"sec-calendar\" style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;display:flex;align-items:center;gap:.6rem\"><span style=\"font-size:.75em\">▸<\u002Fspan>Studio calendar<span title=\"Unpublished changes\" style=\"width:9px;height:9px;border-radius:50%;background:#C9A227;display:{{ chCalendar }}\"><\u002Fspan><a href=\"portal.html\" target=\"_blank\" sc-camel-on-click=\"{{ stopClick }}\" style=\"margin-left:auto;font-family:'Jost',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#56618A;text-decoration:none;white-space:nowrap\">View live page ↗<\u002Fa><\u002Fsummary>\n    <label style=\"display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:#56618A;margin:.7rem 0 1.1rem\">Season\n      <input type=\"text\" value=\"{{ season }}\" sc-camel-on-change=\"{{ setSeason }}\" style=\"width:110px\">\n    <\u002Flabel>\n    <div style=\"display:flex;flex-direction:column;gap:.7rem\">\n      <sc-for list=\"{{ events }}\" as=\"ev\" hint-placeholder-count=\"3\">\n        <div style=\"border:1px solid rgba(29,38,71,.12);border-radius:10px;padding:.9rem 1rem;background:#fff\">\n          <div style=\"display:grid;grid-template-columns:1fr 1fr 1.1fr auto;gap:.6rem;align-items:end\">\n            <label style=\"font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#56618A\">Month\n              <input type=\"text\" value=\"{{ ev.month }}\" sc-camel-on-change=\"{{ ev.setMonth }}\" style=\"margin-top:.25rem;font-weight:400;letter-spacing:0;text-transform:none\">\n            <\u002Flabel>\n            <label style=\"font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#56618A\">Date shown\n              <input type=\"text\" value=\"{{ ev.when }}\" sc-camel-on-change=\"{{ ev.setWhen }}\" style=\"margin-top:.25rem;font-weight:400;letter-spacing:0;text-transform:none\">\n            <\u002Flabel>\n            <label style=\"font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#56618A\">Color chip\n              <sc-raw-select value=\"{{ ev.type }}\" sc-camel-on-change=\"{{ ev.setType }}\" style=\"margin-top:.25rem;font-weight:400;letter-spacing:0;text-transform:none\">\n                <option value=\"milestone\">Milestone<\u002Foption>\n                <option value=\"closed\">Studio closed<\u002Foption>\n                <option value=\"tickets\">Tickets<\u002Foption>\n                <option value=\"due\">Payment due<\u002Foption>\n                <option value=\"performance\">Performance<\u002Foption>\n                <option value=\"event\">Event<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Flabel>\n            <div style=\"display:flex;gap:.35rem;padding-bottom:.15rem\">\n              <button title=\"Move up\" sc-camel-on-click=\"{{ ev.moveUp }}\" style=\"width:32px;height:32px;border:1px solid rgba(29,38,71,.2);background:#FBFAF7;border-radius:7px;cursor:pointer\">↑<\u002Fbutton>\n              <button title=\"Move down\" sc-camel-on-click=\"{{ ev.moveDown }}\" style=\"width:32px;height:32px;border:1px solid rgba(29,38,71,.2);background:#FBFAF7;border-radius:7px;cursor:pointer\">↓<\u002Fbutton>\n              <button title=\"Delete\" sc-camel-on-click=\"{{ ev.remove }}\" style=\"width:32px;height:32px;border:1px solid rgba(124,58,77,.35);background:#FBFAF7;color:#7C3A4D;border-radius:7px;cursor:pointer\">×<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:1.2fr 1.8fr;gap:.6rem;margin-top:.6rem\">\n            <label style=\"font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#56618A\">Event name\n              <input type=\"text\" value=\"{{ ev.title }}\" sc-camel-on-change=\"{{ ev.setTitle }}\" style=\"margin-top:.25rem;font-weight:400;letter-spacing:0;text-transform:none\">\n            <\u002Flabel>\n            <label style=\"font-size:.7rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#56618A\">Small note (optional)\n              <input type=\"text\" value=\"{{ ev.note }}\" sc-camel-on-change=\"{{ ev.setNote }}\" style=\"margin-top:.25rem;font-weight:400;letter-spacing:0;text-transform:none\">\n            <\u002Flabel>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ addEvent }}\" style=\"margin-top:1rem;background:none;border:1px dashed rgba(29,38,71,.35);color:#56618A;border-radius:10px;padding:.7rem 1.2rem;width:100%;cursor:pointer;font-size:.85rem\" style-hover=\"border-color:#1D2647;color:#1D2647\">+ Add a calendar entry<\u002Fbutton>\n  <\u002Fdetails>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · Class schedule\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <details>\n    <summary id=\"sec-schedule\" style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;display:flex;align-items:center;gap:.6rem\"><span style=\"font-size:.75em\">▸<\u002Fspan>Weekly class schedule<span title=\"Unpublished changes\" style=\"width:9px;height:9px;border-radius:50%;background:#C9A227;display:{{ chSchedule }}\"><\u002Fspan><a href=\"classes.html\" target=\"_blank\" sc-camel-on-click=\"{{ stopClick }}\" style=\"margin-left:auto;font-family:'Jost',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#56618A;text-decoration:none;white-space:nowrap\">View live page ↗<\u002Fa><\u002Fsummary>\n    <p style=\"color:#56618A;font-size:.88rem;line-height:1.5;margin-bottom:1rem\">The times listed under each style on the Classes page. Click a style to open it.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:.6rem\">\n      <sc-for list=\"{{ styles }}\" as=\"st\" hint-placeholder-count=\"0\">\n        <details style=\"border:1px solid rgba(29,38,71,.12);border-radius:10px;background:#fff;padding:.2rem .9rem\">\n          <summary style=\"cursor:pointer;font-weight:600;font-size:.9rem;color:#1D2647;padding:.6rem 0\">{{ st.name }} <span style=\"font-weight:400;color:#56618A;font-size:.8rem\">· {{ st.count }}<\u002Fspan><\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:.5rem;padding:.3rem 0 .9rem\">\n            <div style=\"display:flex;flex-wrap:wrap;gap:.4rem;align-items:center;padding-bottom:.4rem;border-bottom:1px dashed rgba(29,38,71,.15);margin-bottom:.3rem\">\n              <span style=\"font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A;margin-right:.2rem\">Groups shown<\u002Fspan>\n              <sc-for list=\"{{ st.tags }}\" as=\"tag\" hint-placeholder-count=\"0\">\n                <span style=\"display:inline-flex;align-items:center;gap:.35rem;border:1px solid rgba(29,38,71,.3);border-radius:999px;padding:.22rem .3rem .22rem .75rem;font-size:.78rem;color:#1D2647;background:#fff\">{{ tag.v }}\n                  <button title=\"Remove this group\" sc-camel-on-click=\"{{ tag.remove }}\" style=\"border:none;background:rgba(124,58,77,.1);color:#7C3A4D;border-radius:50%;width:18px;height:18px;line-height:1;font-size:.75rem;cursor:pointer;padding:0\">×<\u002Fbutton>\n                <\u002Fspan>\n              <\u002Fsc-for>\n              <button sc-camel-on-click=\"{{ st.addTag }}\" style=\"border:1px dashed rgba(29,38,71,.35);background:none;color:#56618A;border-radius:999px;padding:.22rem .8rem;font-size:.78rem;cursor:pointer\">+ Add group<\u002Fbutton>\n            <\u002Fdiv>\n            <sc-for list=\"{{ st.rows }}\" as=\"row\" hint-placeholder-count=\"0\">\n              <div style=\"display:grid;grid-template-columns:auto auto auto 1fr auto;gap:.5rem;align-items:center\">\n                <sc-raw-select value=\"{{ row.day }}\" sc-camel-on-change=\"{{ row.setDay }}\" style=\"font-size:.85rem;width:auto\">\n                  <option value=\"Mon\">Monday<\u002Foption><option value=\"Tue\">Tuesday<\u002Foption><option value=\"Wed\">Wednesday<\u002Foption><option value=\"Thu\">Thursday<\u002Foption><option value=\"Sat\">Saturday<\u002Foption>\n                <\u002Fsc-raw-select>\n                <sc-raw-select value=\"{{ row.start }}\" sc-camel-on-change=\"{{ row.setStart }}\" style=\"font-size:.85rem;width:auto\">\n                  <sc-for list=\"{{ row.times }}\" as=\"t\" hint-placeholder-count=\"0\"><option value=\"{{ t.v }}\">{{ t.v }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <sc-raw-select value=\"{{ row.end }}\" sc-camel-on-change=\"{{ row.setEnd }}\" style=\"font-size:.85rem;width:auto\">\n                  <sc-for list=\"{{ row.times }}\" as=\"t\" hint-placeholder-count=\"0\"><option value=\"{{ t.v }}\">{{ t.v }}<\u002Foption><\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <sc-raw-select value=\"{{ row.what }}\" sc-camel-on-change=\"{{ row.setWhat }}\" style=\"font-size:.85rem\">\n                  <sc-for list=\"{{ row.options }}\" as=\"opt\" hint-placeholder-count=\"0\">\n                    <option value=\"{{ opt.v }}\">{{ opt.v }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n                <button title=\"Delete\" sc-camel-on-click=\"{{ row.remove }}\" style=\"border:1px solid rgba(124,58,77,.35);background:#FBFAF7;color:#7C3A4D;border-radius:7px;width:30px;height:30px;cursor:pointer\">×<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ st.hasOptions }}\" hint-placeholder-val=\"{{ true }}\">\n              <button sc-camel-on-click=\"{{ st.addRow }}\" style=\"background:none;border:1px dashed rgba(29,38,71,.35);color:#56618A;border-radius:8px;padding:.45rem;cursor:pointer;font-size:.8rem\">+ Add a class time<\u002Fbutton>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ st.hasNoOptions }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"color:#56618A;font-size:.82rem\">Not offered this season. Contact Jessey to bring this style back.<\u002Fp>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdetails>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · Gallery\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <details>\n    <summary id=\"sec-gallery\" style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;display:flex;align-items:center;gap:.6rem\"><span style=\"font-size:.75em\">▸<\u002Fspan>Gallery photos<span title=\"Unpublished changes\" style=\"width:9px;height:9px;border-radius:50%;background:#C9A227;display:{{ chGallery }}\"><\u002Fspan><a href=\"gallery.html\" target=\"_blank\" sc-camel-on-click=\"{{ stopClick }}\" style=\"margin-left:auto;font-family:'Jost',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#56618A;text-decoration:none;white-space:nowrap\">View live page ↗<\u002Fa><\u002Fsummary>\n    <p style=\"color:#56618A;font-size:.88rem;line-height:1.5;margin-bottom:1rem\">This is the whole Gallery page \\u2014 add, remove, reorder, or recategorize any photo. Big phone photos are shrunk automatically.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem\">\n      <sc-for list=\"{{ galPhotos }}\" as=\"gp\" hint-placeholder-count=\"0\">\n        <div draggable=\"{{ true }}\" sc-camel-on-drag-start=\"{{ gp.dragStart }}\" sc-camel-on-drag-over=\"{{ dragOver }}\" sc-camel-on-drop=\"{{ gp.drop }}\" style=\"border:1px solid rgba(29,38,71,.12);border-radius:10px;overflow:hidden;background:#fff;display:flex;flex-direction:column;cursor:grab\">\n          <sc-if value=\"{{ gp.hasPreview }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ gp.preview }}\" alt=\"\" style=\"width:100%;height:120px;object-fit:cover;display:block\"><\u002Fsc-if>\n          <div style=\"padding:.5rem;display:flex;flex-direction:column;gap:.4rem\">\n            <sc-raw-select value=\"{{ gp.caption }}\" sc-camel-on-change=\"{{ gp.setCaption }}\" style=\"font-size:.8rem;padding:.35rem .4rem\">\n              <option>Studio<\u002Foption><option>Performing Company<\u002Foption><option>Senior Company<\u002Foption><option>Junior Company<\u002Foption><option>Competition Team<\u002Foption><option>Senior Team<\u002Foption><option>Junior Team<\u002Foption><option>Mini Team<\u002Foption><option>Lyrical<\u002Foption><option>Contemporary<\u002Foption><option>Jazz<\u002Foption><option>Hip-Hop<\u002Foption><option>Ballet<\u002Foption><option>Technique<\u002Foption><option>Tap<\u002Foption><option>Acro<\u002Foption><option>Tiny Dancers<\u002Foption><option>Young Dancers<\u002Foption><option>Duet<\u002Foption><option>Trio<\u002Foption><option>Seniors<\u002Foption><option>First Recital<\u002Foption><option>Recital Day<\u002Foption>\n            <\u002Fsc-raw-select>\n            <input type=\"text\" placeholder=\"Caption (optional)\" value=\"{{ gp.note }}\" sc-camel-on-change=\"{{ gp.setNote }}\" style=\"font-size:.78rem;padding:.35rem .4rem\">\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:.4rem\">\n              <label style=\"display:flex;align-items:center;gap:.3rem;font-size:.72rem;color:#56618A;cursor:pointer\"><input type=\"checkbox\" checked=\"{{ gp.wide }}\" sc-camel-on-change=\"{{ gp.toggleWide }}\" style=\"width:auto;accent-color:#1D2647\">Wide<\u002Flabel>\n              <div style=\"display:flex;gap:.25rem\">\n                <button title=\"Move earlier\" sc-camel-on-click=\"{{ gp.moveUp }}\" style=\"border:1px solid rgba(29,38,71,.2);background:#FBFAF7;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:.75rem\">←<\u002Fbutton>\n                <button title=\"Move later\" sc-camel-on-click=\"{{ gp.moveDown }}\" style=\"border:1px solid rgba(29,38,71,.2);background:#FBFAF7;border-radius:6px;width:26px;height:26px;cursor:pointer;font-size:.75rem\">→<\u002Fbutton>\n                <button title=\"Remove\" sc-camel-on-click=\"{{ gp.remove }}\" style=\"border:1px solid rgba(124,58,77,.35);background:none;color:#7C3A4D;border-radius:6px;width:26px;height:26px;font-size:.8rem;cursor:pointer\">×<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <label style=\"display:block;margin-top:1rem;border:1px dashed rgba(29,38,71,.35);border-radius:10px;padding:.9rem;text-align:center;color:#56618A;font-size:.88rem;cursor:pointer\">\n      + Add photos (you can pick several at once)\n      <input type=\"file\" accept=\"image/*\" multiple=\"\" sc-camel-on-change=\"{{ addGalleryFiles }}\" style=\"display:none\">\n    <\u002Flabel>\n  <\u002Fdetails>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · Summer flyers\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <details>\n    <summary id=\"sec-flyers\" style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;display:flex;align-items:center;gap:.6rem\"><span style=\"font-size:.75em\">▸<\u002Fspan>Summer camp flyers<span title=\"Unpublished changes\" style=\"width:9px;height:9px;border-radius:50%;background:#C9A227;display:{{ chFlyers }}\"><\u002Fspan><a href=\"summer.html\" target=\"_blank\" sc-camel-on-click=\"{{ stopClick }}\" style=\"margin-left:auto;font-family:'Jost',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#56618A;text-decoration:none;white-space:nowrap\">View live page ↗<\u002Fa><\u002Fsummary>\n    <div style=\"display:flex;gap:.5rem;flex-wrap:wrap;margin:.7rem 0 .3rem\">\n      <button sc-camel-on-click=\"{{ sortFlyers }}\" style=\"border:1px solid rgba(29,38,71,.25);background:none;color:#1D2647;border-radius:999px;padding:.3rem .9rem;font-size:.75rem;cursor:pointer\">Sort by date<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ resetFlyers }}\" style=\"border:1px solid rgba(29,38,71,.25);background:none;color:#56618A;border-radius:999px;padding:.3rem .9rem;font-size:.75rem;cursor:pointer\">Restore original flyers<\u002Fbutton>\n    <\u002Fdiv>\n    <p style=\"color:#56618A;font-size:.88rem;line-height:1.5;margin-bottom:1rem\">{{ flyerNote }}<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:.8rem\">\n      <sc-for list=\"{{ flyers }}\" as=\"fl\" hint-placeholder-count=\"0\">\n        <div draggable=\"{{ true }}\" sc-camel-on-drag-start=\"{{ fl.dragStart }}\" sc-camel-on-drag-over=\"{{ dragOver }}\" sc-camel-on-drop=\"{{ fl.drop }}\" style=\"border:1px solid rgba(29,38,71,.12);border-radius:10px;overflow:hidden;background:#fff;cursor:grab\">\n          <sc-if value=\"{{ fl.hasPreview }}\" hint-placeholder-val=\"{{ false }}\"><img src=\"{{ fl.preview }}\" alt=\"\" style=\"width:100%;height:160px;object-fit:cover;display:block;opacity:{{ fl.cardOpacity }}\"><\u002Fsc-if>\n          <div style=\"padding:.45rem .5rem .1rem;display:flex;flex-direction:column;gap:.35rem\">\n            <label style=\"display:flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#56618A\">Starts\n              <input type=\"date\" value=\"{{ fl.date }}\" sc-camel-on-change=\"{{ fl.setDate }}\" style=\"font-size:.75rem;padding:.25rem .35rem;font-weight:400;letter-spacing:0\">\n            <\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:.35rem;font-size:.68rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:#56618A\">Ends\n              <input type=\"date\" value=\"{{ fl.endDate }}\" sc-camel-on-change=\"{{ fl.setEndDate }}\" style=\"font-size:.75rem;padding:.25rem .35rem;font-weight:400;letter-spacing:0\">\n            <\u002Flabel>\n            <label style=\"display:flex;align-items:center;gap:.35rem;font-size:.75rem;color:#56618A;cursor:pointer\">\n              <input type=\"checkbox\" checked=\"{{ fl.hidden }}\" sc-camel-on-change=\"{{ fl.toggleHidden }}\" style=\"width:auto;accent-color:#1D2647\">Hide on the site\n              <span style=\"display:{{ fl.passed }};background:rgba(124,58,77,.12);color:#7C3A4D;border-radius:999px;padding:.05rem .5rem;font-size:.68rem\">date passed<\u002Fspan>\n            <\u002Flabel>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:space-between;padding:.4rem .5rem\">\n            <button title=\"Move left\" sc-camel-on-click=\"{{ fl.moveUp }}\" style=\"border:1px solid rgba(29,38,71,.2);background:#FBFAF7;border-radius:6px;width:28px;height:28px;cursor:pointer\">←<\u002Fbutton>\n            <button title=\"Delete\" sc-camel-on-click=\"{{ fl.remove }}\" style=\"border:1px solid rgba(124,58,77,.35);background:#FBFAF7;color:#7C3A4D;border-radius:6px;width:28px;height:28px;cursor:pointer\">×<\u002Fbutton>\n            <button title=\"Move right\" sc-camel-on-click=\"{{ fl.moveDown }}\" style=\"border:1px solid rgba(29,38,71,.2);background:#FBFAF7;border-radius:6px;width:28px;height:28px;cursor:pointer\">→<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <label style=\"display:block;margin-top:1rem;border:1px dashed rgba(29,38,71,.35);border-radius:10px;padding:.9rem;text-align:center;color:#56618A;font-size:.88rem;cursor:pointer\">\n      + Add flyer images\n      <input type=\"file\" accept=\"image/*\" multiple=\"\" sc-camel-on-change=\"{{ addFlyerFiles }}\" style=\"display:none\">\n    <\u002Flabel>\n    <div style=\"margin-top:1.3rem;border-top:1px solid rgba(29,38,71,.12);padding-top:1rem\">\n      <p style=\"font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A;margin-bottom:.7rem\">Preview — how the Summer page will show them<\u002Fp>\n      <div style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:10px;padding:.9rem;display:flex;gap:.9rem;overflow-x:auto\">\n        <sc-for list=\"{{ previewFlyers }}\" as=\"pf\" hint-placeholder-count=\"0\">\n          <img src=\"{{ pf.src }}\" alt=\"\" style=\"flex:0 0 150px;width:150px;height:200px;object-fit:cover;object-position:top;border-radius:8px;border:1px solid rgba(29,38,71,.13);box-shadow:0 6px 16px rgba(29,38,71,.1)\">\n        <\u002Fsc-for>\n        <sc-if value=\"{{ previewEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n          <p style=\"color:#56618A;font-size:.85rem;padding:.4rem 0\">No flyers will show — all are hidden or the list is empty (the Summer page will fall back to the original 2026 flyers).<\u002Fp>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <p style=\"color:#56618A;font-size:.8rem;margin-top:.6rem\">This is the order and set visitors will see after you publish. Hidden flyers are left out automatically.<\u002Fp>\n    <\u002Fdiv>\n  <\u002Fdetails>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · Testimonials\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <details>\n    <summary id=\"sec-quotes\" style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;display:flex;align-items:center;gap:.6rem\"><span style=\"font-size:.75em\">▸<\u002Fspan>Parent testimonials<span title=\"Unpublished changes\" style=\"width:9px;height:9px;border-radius:50%;background:#C9A227;display:{{ chQuotes }}\"><\u002Fspan><a href=\"index.html\" target=\"_blank\" sc-camel-on-click=\"{{ stopClick }}\" style=\"margin-left:auto;font-family:'Jost',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#56618A;text-decoration:none;white-space:nowrap\">View live page ↗<\u002Fa><\u002Fsummary>\n    <p style=\"color:#56618A;font-size:.88rem;line-height:1.5;margin-bottom:1rem\">The “What parents tell us” quotes on the home page. Use real quotes (with permission) — three look best.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:.7rem\">\n      <sc-for list=\"{{ quotes }}\" as=\"q\" hint-placeholder-count=\"0\">\n        <div style=\"border:1px solid rgba(29,38,71,.12);border-radius:10px;padding:.9rem 1rem;background:#fff;display:grid;grid-template-columns:1fr auto;gap:.6rem;align-items:start\">\n          <div style=\"display:flex;flex-direction:column;gap:.5rem\">\n            <textarea rows=\"2\" value=\"{{ q.quote }}\" sc-camel-on-change=\"{{ q.setQuote }}\" style=\"width:100%;background:#fff;border:1px solid rgba(29,38,71,.22);border-radius:8px;padding:.55rem .7rem;resize:vertical;font-size:.92rem;line-height:1.5\"><\u002Ftextarea>\n            <input type=\"text\" placeholder=\"Who said it, e.g. Barbara’s Academy parent · company family\" value=\"{{ q.who }}\" sc-camel-on-change=\"{{ q.setWho }}\" style=\"font-size:.85rem\">\n          <\u002Fdiv>\n          <button title=\"Delete\" sc-camel-on-click=\"{{ q.remove }}\" style=\"border:1px solid rgba(124,58,77,.35);background:#FBFAF7;color:#7C3A4D;border-radius:7px;width:32px;height:32px;cursor:pointer\">×<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ addQuote }}\" style=\"margin-top:1rem;background:none;border:1px dashed rgba(29,38,71,.35);color:#56618A;border-radius:10px;padding:.7rem 1.2rem;width:100%;cursor:pointer;font-size:.85rem\">+ Add a testimonial<\u002Fbutton>\n  <\u002Fdetails>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · Nutcracker\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <details>\n    <summary id=\"sec-nut\" style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;display:flex;align-items:center;gap:.6rem\"><span style=\"font-size:.75em\">▸<\u002Fspan>Nutcracker tickets<span title=\"Unpublished changes\" style=\"width:9px;height:9px;border-radius:50%;background:#C9A227;display:{{ chNut }}\"><\u002Fspan><a href=\"nutcracker.html\" target=\"_blank\" sc-camel-on-click=\"{{ stopClick }}\" style=\"margin-left:auto;font-family:'Jost',sans-serif;font-weight:500;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:#56618A;text-decoration:none;white-space:nowrap\">View live page ↗<\u002Fa><\u002Fsummary>\n    <label style=\"display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:#56618A;cursor:pointer;margin:.7rem 0 1rem\">\n      <input type=\"checkbox\" checked=\"{{ nutShow }}\" sc-camel-on-change=\"{{ toggleNutShow }}\" style=\"width:auto;accent-color:#1D2647\">Show on the Nutcracker page\n    <\u002Flabel>\n    <p style=\"color:#56618A;font-size:.88rem;line-height:1.5;margin-bottom:1rem\">A ticket banner under the Nutcracker page hero. Turn it on when dates and tickets are set; turn it off after the show.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:1fr;gap:.9rem\">\n      <label style=\"font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A\">Banner text (date &amp; venue)\n        <input type=\"text\" placeholder=\"e.g. Saturday, December 13 · 2 PM &amp; 7 PM · Mercy High School\" value=\"{{ nutText }}\" sc-camel-on-change=\"{{ setNutText }}\" style=\"margin-top:.35rem;font-weight:400;letter-spacing:0;text-transform:none\">\n      <\u002Flabel>\n      <div style=\"display:grid;grid-template-columns:1fr 1.4fr;gap:.9rem\">\n        <label style=\"font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A\">Button text\n          <input type=\"text\" value=\"{{ nutLink }}\" sc-camel-on-change=\"{{ setNutLink }}\" style=\"margin-top:.35rem;font-weight:400;letter-spacing:0;text-transform:none\">\n        <\u002Flabel>\n        <label style=\"font-size:.78rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A\">Button link (web address)\n          <input type=\"text\" value=\"{{ nutHref }}\" sc-camel-on-change=\"{{ setNutHref }}\" style=\"margin-top:.35rem;font-weight:400;letter-spacing:0;text-transform:none\">\n        <\u002Flabel>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdetails>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · Page text\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <details>\n    <summary id=\"sec-text\" style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;display:flex;align-items:center;gap:.6rem\"><span style=\"font-size:.75em\">▸<\u002Fspan>Page text<span title=\"Unpublished changes\" style=\"width:9px;height:9px;border-radius:50%;background:#C9A227;display:{{ chText }}\"><\u002Fspan><\u002Fsummary>\n    <p style=\"color:#56618A;font-size:.88rem;line-height:1.5;margin:.7rem 0 1rem\">The key passages on each page. Edit carefully — short and warm reads best. “Original” puts back the wording the page launched with.<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:.6rem\">\n      <sc-for list=\"{{ textGroups }}\" as=\"grp\" hint-placeholder-count=\"0\">\n        <details style=\"border:1px solid rgba(29,38,71,.12);border-radius:10px;background:#fff;padding:.2rem .9rem\">\n          <summary style=\"cursor:pointer;font-weight:600;font-size:.9rem;color:#1D2647;padding:.6rem 0\">{{ grp.page }}<\u002Fsummary>\n          <div style=\"display:flex;flex-direction:column;gap:.9rem;padding:.3rem 0 .9rem\">\n            <sc-for list=\"{{ grp.fields }}\" as=\"fld\" hint-placeholder-count=\"0\">\n              <label style=\"display:block;font-size:.72rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#56618A\">\n                <span style=\"display:flex;align-items:center;justify-content:space-between;gap:.6rem\">{{ fld.label }}\n                  <button sc-camel-on-click=\"{{ fld.reset }}\" style=\"border:none;background:none;color:#B98C83;font-size:.72rem;letter-spacing:.04em;text-transform:none;cursor:pointer;text-decoration:underline;padding:0\">Original<\u002Fbutton>\n                <\u002Fspan>\n                <textarea rows=\"3\" value=\"{{ fld.value }}\" sc-camel-on-change=\"{{ fld.set }}\" style=\"width:100%;margin-top:.35rem;background:#fff;border:1px solid rgba(29,38,71,.22);border-radius:8px;padding:.55rem .7rem;resize:vertical;font-size:.9rem;line-height:1.5;font-weight:400;letter-spacing:0;text-transform:none\"><\u002Ftextarea>\n              <\u002Flabel>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdetails>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <\u002Fdetails>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · History\" style=\"background:#FBFAF7;border:1px solid rgba(29,38,71,.12);border-radius:14px;padding:1.6rem 1.8rem;margin-bottom:1.4rem\">\n    <details>\n    <summary id=\"sec-history\" style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;display:flex;align-items:center;gap:.6rem\"><span style=\"font-size:.75em\">▸<\u002Fspan>Undo — restore an earlier version<\u002Fsummary>\n    <p style=\"color:#56618A;font-size:.88rem;line-height:1.5;margin-bottom:1rem\">Every publish is saved. Restoring loads that version into this editor — look it over, then press Publish to make it live. (Photos are never deleted, so restored versions always work.)<\u002Fp>\n    <div style=\"display:flex;flex-direction:column;gap:.5rem\">\n      <sc-for list=\"{{ history }}\" as=\"h\" hint-placeholder-count=\"0\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid rgba(29,38,71,.12);border-radius:9px;padding:.6rem .9rem;background:#fff\">\n          <div style=\"font-size:.85rem;color:#2A3253\">{{ h.label }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ h.restore }}\" style=\"border:1px solid rgba(29,38,71,.25);background:none;color:#1D2647;border-radius:999px;padding:.3rem .9rem;font-size:.75rem;cursor:pointer;white-space:nowrap\">Restore<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ noHistory }}\" hint-placeholder-val=\"{{ false }}\">\n      <p style=\"color:#56618A;font-size:.85rem\">No published versions yet — this list fills in as you publish.<\u002Fp>\n    <\u002Fsc-if>\n  <\u002Fdetails>\n  <\u002Fsection>\n\n  <section data-screen-label=\"Admin · Help\" style=\"background:#F5E7E3;border:1px solid rgba(185,140,131,.4);border-radius:14px;padding:1.4rem 1.8rem;margin-bottom:1.4rem;font-size:.88rem;line-height:1.6;color:#2A3253\">\n    <details>\n    <summary style=\"cursor:pointer;font-family:'Bodoni Moda',serif;font-size:1.3rem;color:#1D2647;padding:.15rem 0;font-size:1.15rem\">How this works<\u002Fsummary>\n    <p>Nothing changes on the website until you press <strong>Publish<\u002Fstrong>. After publishing, the live site updates in about a minute (refresh the page to see it). If something looks wrong, use <strong>Undo<\u002Fstrong> above to restore an earlier version, then Publish. This page edits: the home-page announcement &amp; testimonials, the studio calendar, the weekly class schedule &amp; style groups, all gallery photos, summer flyers, the Nutcracker ticket banner, key page text, and the studio phone/email. For anything else (page structure, alumni stories, new pages), contact Jessey.<\u002Fp>\n  <\u002Fdetails>\n  <\u002Fsection>\n\n  <div style=\"position:sticky;bottom:16px;display:flex;align-items:center;gap:1rem;background:#1D2647;color:#FBFAF7;border-radius:14px;padding:1rem 1.4rem;box-shadow:0 14px 40px rgba(29,38,71,.28)\">\n    <button sc-camel-on-click=\"{{ publish }}\" disabled=\"{{ saving }}\" style=\"background:#C9A227;color:#1D2647;border:none;border-radius:999px;padding:.7rem 1.6rem;font-size:.78rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer\">{{ publishLabel }}<\u002Fbutton>\n    <div style=\"font-size:.85rem;line-height:1.4;opacity:.9\">{{ statusMsg }}<\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fmain>\n<footer style=\"text-align:center;padding:1.4rem;font-size:.75rem;color:#56618A\">This page is for studio staff. Families: <a href=\"index.html\">barbarasdancestudio.com<\u002Fa><\u002Ffooter>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    let cfg = {};\n    try { cfg = JSON.parse(localStorage.getItem('bh-admin-cfg') || '{}'); } catch (e) {}\n    this.state = {\n      cfgRepo: cfg.repo || '', cfgToken: cfg.token || '',\n      authed: false, checking: false, loginError: '',\n      sha: null, data: null, saving: false, dirty: false, statusMsg: '', history: []\n    };\n  }\n  componentDidMount() {\n    if (this.state.cfgRepo && this.state.cfgToken) this.signIn();\n    this.fetchTraffic();\n    this._guard = (e) => { if (this.state.dirty) { e.preventDefault(); e.returnValue = ''; } };\n    window.addEventListener('beforeunload', this._guard);\n  }\n  componentWillUnmount() { window.removeEventListener('beforeunload', this._guard); }\n\n  fetchTraffic() {\n    const pages = [\n      { path: '/', label: 'Home' }, { path: '/classes.html', label: 'Classes' },\n      { path: '/register.html', label: 'Register' }, { path: '/contact.html', label: 'Contact' },\n      { path: '/summer.html', label: 'Summer' }, { path: '/portal.html', label: 'Portal' }\n    ];\n    Promise.all(pages.map(p =>\n      fetch('https://bhdance.goatcounter.com/counter/' + encodeURIComponent(p.path) + '.json')\n        .then(r => r.ok ? r.json() : null).catch(() => null)\n        .then(j => j && j.count != null ? { label: p.label, v: String(j.count).trim() } : null)\n    )).then(rows => {\n      const ok = rows.filter(Boolean);\n      this.setState({ traffic: ok.length ? ok : null, trafficChecked: true });\n    });\n  }\n\n  api(path, opts) {\n    const repo = this.state.cfgRepo.trim().replace(/^https?:\\/\\/github\\.com\\//, '').replace(/\\/$/, '');\n    return fetch('https://api.github.com/repos/' + repo + '/contents/' + path, Object.assign({\n      headers: {\n        'Authorization': 'Bearer ' + this.state.cfgToken.trim(),\n        'Accept': 'application/vnd.github+json'\n      }\n    }, opts));\n  }\n\n  async signIn() {\n    if (!this.state.cfgRepo.trim() || !this.state.cfgToken.trim()) {\n      this.setState({ loginError: 'Please fill in both boxes.' }); return;\n    }\n    this.setState({ checking: true, loginError: '' });\n    try {\n      const r = await this.api('site-data.json?ref=main');\n      if (r.status === 401) throw new Error('That access key was not accepted. Check it was copied fully.');\n      let sha = null, data = null, msg = 'Loaded the live site content. Make your changes, then press Publish.';\n      if (r.ok) {\n        const j = await r.json();\n        data = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\\n/g, '')))));\n        sha = j.sha;\n      } else if (r.status === 404) {\n        // The data file doesn't exist yet — verify we can at least see the repo, then seed defaults.\n        const repo = this.state.cfgRepo.trim().replace(/^https?:\\/\\/github\\.com\\//, '').replace(/\\/$/, '');\n        const rr = await fetch('https://api.github.com/repos/' + repo, { headers: { 'Authorization': 'Bearer ' + this.state.cfgToken.trim(), 'Accept': 'application/vnd.github+json' } });\n        if (!rr.ok) throw new Error('Could not find the site. Check the site code looks like \"name/BHDance\", and the key has access to it.');\n        let seeded = null;\n        try { const sd = await fetch('./site-data.json', { cache: 'no-store' }); if (sd.ok) seeded = await sd.json(); } catch (e) {}\n        data = seeded || Component.DEFAULT_DATA;\n        msg = 'First-time setup: press Publish once to save the starting content to the site.';\n      } else {\n        throw new Error('Could not connect (' + r.status + '). Try again in a minute.');\n      }\n      try { localStorage.setItem('bh-admin-cfg', JSON.stringify({ repo: this.state.cfgRepo.trim(), token: this.state.cfgToken.trim() })); } catch (e) {}\n      const norm = this.normalize(data);\n      this._pub = JSON.parse(JSON.stringify(norm));\n      this.setState({ authed: true, checking: false, sha, data: norm, dirty: sha === null, statusMsg: msg });\n      this.loadHistory();\n    } catch (e) {\n      this.setState({ checking: false, loginError: e.message || String(e) });\n    }\n  }\n  async loadHistory() {\n    try {\n      const repo = this.state.cfgRepo.trim().replace(/^https?:\\/\\/github\\.com\\//, '').replace(/\\/$/, '');\n      const r = await fetch('https://api.github.com/repos/' + repo + '/commits?path=site-data.json&per_page=8', {\n        headers: { 'Authorization': 'Bearer ' + this.state.cfgToken.trim(), 'Accept': 'application/vnd.github+json' }\n      });\n      if (r.ok) {\n        const list = await r.json();\n        this.setState({ history: list.map(c => ({ sha: c.sha, when: new Date(c.commit.committer.date).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) })) });\n      }\n    } catch (e) {}\n  }\n  async restore(sha, when) {\n    if (this.state.dirty && !confirm('This replaces your unpublished changes. Continue?')) return;\n    try {\n      const r = await this.api('site-data.json?ref=' + sha);\n      if (!r.ok) throw new Error('Could not load that version (' + r.status + ').');\n      const j = await r.json();\n      const data = this.normalize(JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\\n/g, ''))))));\n      this.setState({ data, dirty: true, statusMsg: 'Loaded the version from ' + when + ' \\u2014 press Publish to make it live.' });\n    } catch (e) { this.setState({ statusMsg: e.message || String(e) }); }\n  }\n  signOut() {\n    if (this.state.dirty && !confirm('You have unpublished changes. Sign out anyway?')) return;\n    try { localStorage.removeItem('bh-admin-cfg'); } catch (e) {}\n    this.setState({ authed: false, cfgToken: '', sha: null, data: null, dirty: false, statusMsg: '' });\n  }\n\n  normalize(data) {\n    if (!Array.isArray(data.galleryExtra)) data.galleryExtra = [];\n    if (!Array.isArray(data.summerFlyers) || !data.summerFlyers.length) data.summerFlyers = Component.DEFAULT_FLYERS;\n    if (!Array.isArray(data.testimonials) || !data.testimonials.length) data.testimonials = Component.DEFAULT_DATA.testimonials;\n    if (!data.nutcracker) data.nutcracker = { show: false, text: '', linkText: 'Get tickets', linkHref: '' };\n    if (!Array.isArray(data.classSchedules) || data.classSchedules.length !== 9 || data.schedVersion !== 3) { data.classSchedules = Component.DEFAULT_SCHED; data.schedVersion = 3; }\n    if (!Array.isArray(data.classTags) || data.classTags.length !== 9) data.classTags = Component.DEFAULT_TAGS;\n    if (!data.pageText) { data.pageText = {}; Component.DEFAULT_TEXT.forEach(t => { data.pageText[t.k] = t.d; }); }\n    if (!Array.isArray(data.gallery) || !data.gallery.length) {\n      // Migrate: seed with the original 48 photos plus any admin-added extras\n      data.gallery = Component.DEFAULT_GALLERY.concat(data.galleryExtra.map(p => ({ src: p.src, caption: p.caption || 'Studio', wide: !!p.wide })));\n      data.galleryExtra = [];\n    }\n    return data;\n  }\n  compressImage(file, maxDim, quality) {\n    return new Promise((resolve, reject) => {\n      const fr = new FileReader();\n      fr.onerror = reject;\n      fr.onload = () => {\n        const img = new Image();\n        img.onerror = reject;\n        img.onload = () => {\n          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));\n          const c = document.createElement('canvas');\n          c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);\n          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);\n          resolve(c.toDataURL('image/jpeg', quality));\n        };\n        img.src = fr.result;\n      };\n      fr.readAsDataURL(file);\n    });\n  }\n  async addFiles(e, kind) {\n    const files = Array.from(e.target.files || []);\n    e.target.value = '';\n    if (!files.length) return;\n    this.uploads = this.uploads || {};\n    this.setState({ statusMsg: 'Preparing ' + files.length + ' photo(s)\\u2026' });\n    for (const f of files) {\n      try {\n        const dataUrl = await this.compressImage(f, kind === 'flyer' ? 1600 : 1400, 0.82);\n        const path = 'photos/' + kind + '-' + Date.now() + '-' + Math.floor(Math.random() * 1e4) + '.jpg';\n        this.uploads[path] = dataUrl;\n        this.patch(x => {\n          if (kind === 'flyer') x.summerFlyers.push({ src: path });\n          else x.gallery.push({ src: path, caption: 'Studio', wide: false });\n        });\n      } catch (err) { this.setState({ statusMsg: 'Could not read one of the photos \\u2014 try a JPG or PNG.' }); }\n    }\n  }\n  patch(fn) {\n    const data = JSON.parse(JSON.stringify(this.state.data));\n    fn(data);\n    this.setState({ data, dirty: true, statusMsg: 'Unpublished changes \\u2014 press Publish when ready.' });\n  }\n\n  static get SECTION_KEYS() {\n    return { announce: ['announcement'], calendar: ['season', 'events'], schedule: ['classSchedules', 'classTags'], gallery: ['gallery'], flyers: ['summerFlyers'], quotes: ['testimonials'], nut: ['nutcracker'], text: ['pageText'] };\n  }\n  static get SECTION_NAMES() {\n    return { announce: 'announcement bar', calendar: 'studio calendar', schedule: 'class schedule', gallery: 'gallery photos', flyers: 'summer flyers', quotes: 'testimonials', nut: 'Nutcracker tickets', text: 'page text' };\n  }\n  changedSections() {\n    const d = this.state.data, p = this._pub || {}, out = {};\n    if (!d) return out;\n    const K = Component.SECTION_KEYS;\n    for (const sec in K) out[sec] = K[sec].some(k => JSON.stringify(d[k]) !== JSON.stringify(p[k]));\n    return out;\n  }\n  async publish() {\n    if (this.state.saving) return;\n    const ch = this.changedSections();\n    const names = Object.keys(ch).filter(k => ch[k]).map(k => Component.SECTION_NAMES[k]);\n    if (names.length && !confirm('Publish changes to: ' + names.join(', ') + '?\\n\\nThe live site updates about a minute after you press OK.')) return;\n    this.setState({ saving: true, statusMsg: 'Publishing\\u2026' });\n    try {\n      // Upload any new photos first (only those still referenced in the data)\n      const used = new Set([].concat(this.state.data.gallery || [], this.state.data.galleryExtra || [], this.state.data.summerFlyers || []).map(p => p.src));\n      const pending = Object.entries(this.uploads || {}).filter(([p]) => used.has(p));\n      let done = 0;\n      for (const [path, dataUrl] of pending) {\n        done++;\n        this.setState({ statusMsg: 'Uploading photo ' + done + ' of ' + pending.length + '\\u2026' });\n        const ur = await this.api(path, {\n          method: 'PUT',\n          body: JSON.stringify({ message: 'Studio admin photo upload', content: dataUrl.split(',')[1], branch: 'main' })\n        });\n        if (!ur.ok && ur.status !== 422) throw new Error('Photo upload failed (' + ur.status + '). Try Publish again.');\n        delete this.uploads[path];\n      }\n      const body = JSON.stringify(this.state.data, null, 2);\n      const payload = {\n        message: 'Studio admin update \\u2014 ' + new Date().toLocaleString(),\n        content: btoa(unescape(encodeURIComponent(body))),\n        branch: 'main'\n      };\n      if (this.state.sha) payload.sha = this.state.sha;\n      const r = await this.api('site-data.json', { method: 'PUT', body: JSON.stringify(payload) });\n      if (!r.ok) {\n        if (r.status === 409) throw new Error('The site changed since you signed in. Sign out and back in, then redo your edit.');\n        throw new Error('Publish failed (' + r.status + '). Your changes are still here \\u2014 try again.');\n      }\n      const j = await r.json();\n      this._pub = JSON.parse(JSON.stringify(this.state.data));\n      this.setState({ saving: false, dirty: false, sha: j.content.sha, statusMsg: 'Published! The live site updates in about a minute.' });\n      this.loadHistory();\n    } catch (e) {\n      this.setState({ saving: false, statusMsg: e.message || String(e) });\n    }\n  }\n\n  static get DEFAULT_TEXT() {\n    return [\n      { k: 'home.heroSub', page: 'Home', label: 'Hero subtitle', d: 'Ballet, tap, jazz, hip-hop and more for all ages \\u2014 taught with the warmth of a small studio and the standards of a serious one, for 40 years and counting.' },\n      { k: 'home.about', page: 'Home', label: 'About the studio paragraph', d: 'Today it\\u2019s led by owner and director Barbara Bouchard \\u2014 \\u201cMiss BeBe\\u201d \\u2014 carrying forward the studio Barbara Hatch founded, with a faculty families know by name. Our dance family spans tiny dancers taking their first steps to company dancers preparing their Nutcracker solos \\u2014 and we\\u2019d love to welcome yours.' },\n      { k: 'classes.intro', page: 'Classes', label: 'Page intro', d: 'From a first preschool combo class to pointe work and championship hip-hop \\u2014 every class builds on a strong ballet foundation, taught by the faculty families know by name.' },\n      { k: 'classes.desc0', page: 'Classes', label: 'Preschool Combo & Trio description', d: 'Two or three styles in one class, sized for little attention spans. Combo pairs ballet with tap or jazz; Trio adds a third style as dancers grow \\u2014 the gentlest possible start.' },\n      { k: 'classes.desc1', page: 'Classes', label: 'Ballet description', d: 'Barre, center, and classical technique \\u2014 the discipline underneath every other style we teach, and the reason our dancers move the way they do.' },\n      { k: 'classes.desc2', page: 'Classes', label: 'Pointe description', d: 'The milestone every ballet dancer works toward. By teacher invitation once ankles and technique are ready \\u2014 strength first, satin second.' },\n      { k: 'classes.desc3', page: 'Classes', label: 'Tap description', d: 'Rhythm, musicality, and fast feet \\u2014 from first shuffles to intricate combinations. The class you hear from the lobby.' },\n      { k: 'classes.desc4', page: 'Classes', label: 'Jazz description', d: 'Energy, precision, and performance style \\u2014 leaps, turns, and the showmanship that carries straight onto the competition stage.' },\n      { k: 'classes.desc5', page: 'Classes', label: 'Lyrical description', d: 'Where ballet technique meets storytelling \\u2014 expressive, flowing movement set to the music your dancer already loves.' },\n      { k: 'classes.desc6', page: 'Classes', label: 'Contemporary description', d: 'Modern movement, floor work, and improvisation layered over classical training. Taught within our Saturday Trio and throughout company choreography.' },\n      { k: 'classes.desc7', page: 'Classes', label: 'Hip-Hop description', d: 'Grooves, isolations, and full-out choreography \\u2014 the style with a class for nearly every age, including one just for the boys.' },\n      { k: 'classes.desc8', page: 'Classes', label: 'Acro description', d: 'Tumbling, flexibility, and controlled strength \\u2014 cartwheels to walkovers and beyond, taught safely and step by step.' },\n      { k: 'summer.sub', page: 'Summer', label: 'Hero subtitle', d: 'Keep dancing all summer long \\u2014 from princess camps for the littlest dancers to technique intensives for company kids. Tap
